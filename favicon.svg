<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff275" />
      <stop offset="50%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#ff80ab" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="32" cy="32" r="30" fill="#120420" stroke="url(#goldGrad)" stroke-width="2.5" />
  <!-- Glowing Crown & Heart -->
  <path d="M18 42 L18 25 L25 33 L32 18 L39 33 L46 25 L46 42 Z" fill="url(#goldGrad)" filter="url(#glow)" />
  <!-- Mini Heart in Center -->
  <path d="M32 37 C30 34 26 34 26 37 C26 40 32 44 32 44 C32 44 38 40 38 37 C38 34 34 34 32 37 Z" fill="#ff4081" />
  <!-- Sparkle Stars -->
  <circle cx="20" cy="18" r="1.5" fill="#ffffff" />
  <circle cx="44" cy="18" r="1.5" fill="#ffffff" />
</svg>
